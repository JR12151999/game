<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.4);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 36px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 4px;
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 18px;
        }

        .info-bar span {
            font-weight: bold;
            color: #f39c12;
        }

        #gameCanvas {
            background: #1a1a2e;
            border: 3px solid #f39c12;
            border-radius: 10px;
            display: block;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.3);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .instructions {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.8;
            color: #ccc;
        }

        .instructions kbd {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #f39c12;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 50px;
            border-radius: 15px;
            border: 2px solid #e74c3c;
            text-align: center;
            display: none;
        }

        .game-over h2 {
            color: #e74c3c;
            font-size: 32px;
            margin-bottom: 15px;
        }

        .game-over p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .difficulty {
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .difficulty label {
            margin-right: 5px;
        }

        .difficulty select {
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .difficulty select option {
            background: #1a1a2e;
        }

        @media (max-width: 500px) {
            .game-container {
                padding: 15px;
            }
            h1 {
                font-size: 28px;
            }
            #gameCanvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇</h1>

        <div class="difficulty">
            <label>难度：</label>
            <select id="difficulty">
                <option value="220">简单</option>
                <option value="160" selected>普通</option>
                <option value="110">困难</option>
                <option value="70">地狱</option>
            </select>
        </div>

        <div class="info-bar">
            <div>分数：<span id="score">0</span></div>
            <div>最高分：<span id="highScore">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <button id="startBtn">开始游戏</button>
            <button id="pauseBtn" disabled>暂停</button>
        </div>

        <div class="instructions">
            <p>🎮 操作说明</p>
            <p>
                使用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或
                <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 控制方向
            </p>
            <p>按 <kbd>空格</kbd> 暂停/继续</p>
            <p>吃到红色食物 +10 分，撞墙或撞到自己游戏结束</p>
        </div>

        <div class="game-over" id="gameOverPanel">
            <h2>游戏结束</h2>
            <p>你的分数：<span id="finalScore">0</span></p>
            <button id="restartBtn">重新开始</button>
        </div>
    </div>

    <script>
        // 获取画布和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI 元素
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const difficultyEl = document.getElementById('difficulty');
        const gameOverPanel = document.getElementById('gameOverPanel');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        // 游戏配置
        const GRID_SIZE = 20;
        const GRID_COUNT = canvas.width / GRID_SIZE;
        const STORAGE_KEY = 'snakeHighScore';

        // 游戏状态
        let snake = [];
        let food = { x: 0, y: 0 };
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
        let isRunning = false;
        let isPaused = false;
        let gameLoop = null;
        let speed = 100;

        // 初始化高分
        highScoreEl.textContent = highScore;

        // 初始化游戏
        function initGame() {
            snake = [
                { x: 8, y: 10 },
                { x: 7, y: 10 },
                { x: 6, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            scoreEl.textContent = score;
            spawnFood();
        }

        // 生成食物
        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_COUNT);
                food.y = Math.floor(Math.random() * GRID_COUNT);
                valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
            }
        }

        // 绘制游戏
        function draw() {
            // 清空画布
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制网格
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i < GRID_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // 绘制食物
            const foodX = food.x * GRID_SIZE + GRID_SIZE / 2;
            const foodY = food.y * GRID_SIZE + GRID_SIZE / 2;
            const gradient = ctx.createRadialGradient(foodX, foodY, 2, foodX, foodY, GRID_SIZE / 2);
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(1, '#c0392b');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(foodX, foodY, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // 食物高光
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(foodX - 3, foodY - 3, 2, 0, Math.PI * 2);
            ctx.fill();

            // 绘制蛇
            snake.forEach((segment, index) => {
                const x = segment.x * GRID_SIZE;
                const y = segment.y * GRID_SIZE;

                if (index === 0) {
                    // 蛇头 - 渐变色
                    const headGradient = ctx.createLinearGradient(x, y, x + GRID_SIZE, y + GRID_SIZE);
                    headGradient.addColorStop(0, '#2ecc71');
                    headGradient.addColorStop(1, '#27ae60');
                    ctx.fillStyle = headGradient;
                } else {
                    // 蛇身 - 渐变色
                    const bodyGradient = ctx.createLinearGradient(x, y, x + GRID_SIZE, y + GRID_SIZE);
                    const fade = 1 - (index / snake.length) * 0.5;
                    bodyGradient.addColorStop(0, `rgba(46, 204, 113, ${fade})`);
                    bodyGradient.addColorStop(1, `rgba(39, 174, 96, ${fade})`);
                    ctx.fillStyle = bodyGradient;
                }

                // 圆角矩形
                const radius = 4;
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + GRID_SIZE - radius, y);
                ctx.quadraticCurveTo(x + GRID_SIZE, y, x + GRID_SIZE, y + radius);
                ctx.lineTo(x + GRID_SIZE, y + GRID_SIZE - radius);
                ctx.quadraticCurveTo(x + GRID_SIZE, y + GRID_SIZE, x + GRID_SIZE - radius, y + GRID_SIZE);
                ctx.lineTo(x + radius, y + GRID_SIZE);
                ctx.quadraticCurveTo(x, y + GRID_SIZE, x, y + GRID_SIZE - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
                ctx.fill();

                // 绘制蛇头眼睛
                if (index === 0) {
                    ctx.fillStyle = '#fff';
                    const eyeSize = 3;
                    let eye1X, eye1Y, eye2X, eye2Y;

                    if (direction.x === 1) {
                        eye1X = x + GRID_SIZE - 6; eye1Y = y + 5;
                        eye2X = x + GRID_SIZE - 6; eye2Y = y + GRID_SIZE - 5;
                    } else if (direction.x === -1) {
                        eye1X = x + 6; eye1Y = y + 5;
                        eye2X = x + 6; eye2Y = y + GRID_SIZE - 5;
                    } else if (direction.y === 1) {
                        eye1X = x + 5; eye1Y = y + GRID_SIZE - 6;
                        eye2X = x + GRID_SIZE - 5; eye2Y = y + GRID_SIZE - 6;
                    } else {
                        eye1X = x + 5; eye1Y = y + 6;
                        eye2X = x + GRID_SIZE - 5; eye2Y = y + 6;
                    }

                    ctx.beginPath();
                    ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
                    ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        // 更新游戏状态
        function update() {
            direction = { ...nextDirection };

            // 蛇头新位置
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // 撞墙检测
            if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
                gameOver();
                return;
            }

            // 撞自己检测
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver();
                return;
            }

            // 移动蛇
            snake.unshift(head);

            // 吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem(STORAGE_KEY, highScore);
                }
                spawnFood();
            } else {
                snake.pop();
            }
        }

        // 游戏主循环
        function loop() {
            if (!isPaused) {
                update();
            }
            draw();
        }

        // 开始游戏
        function startGame() {
            initGame();
            isRunning = true;
            isPaused = false;
            speed = parseInt(difficultyEl.value, 10);
            gameOverPanel.style.display = 'none';
            startBtn.textContent = '重新开始';
            pauseBtn.disabled = false;
            pauseBtn.textContent = '暂停';
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(loop, speed);
        }

        // 暂停/继续
        function togglePause() {
            if (!isRunning) return;
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '继续' : '暂停';
        }

        // 游戏结束
        function gameOver() {
            isRunning = false;
            clearInterval(gameLoop);
            gameLoop = null;
            finalScoreEl.textContent = score;
            gameOverPanel.style.display = 'block';
            pauseBtn.disabled = true;
            startBtn.textContent = '开始游戏';
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            if (key === ' ' || e.code === 'Space') {
                e.preventDefault();
                if (isRunning) {
                    togglePause();
                } else {
                    startGame();
                }
                return;
            }

            if (!isRunning || isPaused) return;

            let newDir = null;

            if (key === 'arrowup' || key === 'w') {
                if (direction.y === 0) newDir = { x: 0, y: -1 };
            } else if (key === 'arrowdown' || key === 's') {
                if (direction.y === 0) newDir = { x: 0, y: 1 };
            } else if (key === 'arrowleft' || key === 'a') {
                if (direction.x === 0) newDir = { x: -1, y: 0 };
            } else if (key === 'arrowright' || key === 'd') {
                if (direction.x === 0) newDir = { x: 1, y: 0 };
            }

            if (newDir) {
                e.preventDefault();
                nextDirection = newDir;
            }
        });

        // 按钮事件
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', startGame);

        difficultyEl.addEventListener('change', () => {
            if (isRunning && !isPaused) {
                clearInterval(gameLoop);
                speed = parseInt(difficultyEl.value, 10);
                gameLoop = setInterval(loop, speed);
            }
        });

        // 初始绘制
        initGame();
        draw();
    </script>
</body>
</html>
